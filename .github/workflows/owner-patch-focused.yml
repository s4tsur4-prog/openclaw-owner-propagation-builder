# Legacy pnpm-check workflow retired by the focused-only verification policy.
# The one-time guard run cancels any predecessor in this concurrency group.
name: Retire legacy Owner candidate focused repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-patch-focused.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-patch-regression
  cancel-in-progress: true
jobs:
  legacy-stop-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Legacy verification retired
        run: echo 'Legacy verification stopped. Use owner-focused.yml; no checks executed here.'
